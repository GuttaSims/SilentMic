<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Meter</title>
    <style>
        #volumeMeter {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
        }

        #volumeMeter div {
            height: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Microphone Volume Meter</h1>
    <button id="startBtn">Start</button>
    <div id="volumeMeter">
        <div id="volumeBar" style="width: 0%; background: linear-gradient(to right, #ff0000, #ffff00, #00ff00);"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const volumeMeter = document.getElementById('volumeMeter');
        const volumeBar = document.getElementById('volumeBar');

        let audioContext;
        let analyser;
        let microphone;
        let scriptProcessor;

        let isMicActive = false;

        // Set your SL server URL
        const SL_SERVER_URL = 'http://simhost-0ce4dfc37f7e1d5a8.agni.secondlife.io:12046/cap/7aabdb9c-4707-e345-fb71-1b7c71de69b7;';

        async function startMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);

                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                scriptProcessor.onaudioprocess = processAudio;
                isMicActive = true;

                startBtn.disabled = true; // Disable button after starting

            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Unable to access your microphone');
            }
        }

        function processAudio(event) {
            if (!isMicActive) return;

            const buffer = event.inputBuffer.getChannelData(0);
            let sum = 0;

            // Calculate the volume level (RMS)
            for (let i = 0; i < buffer.length; i++) {
                sum += buffer[i] * buffer[i];
            }
            const volume = Math.sqrt(sum / buffer.length);

            // Update the visual meter
            updateMeter(volume);

            // Send the volume to the Second Life script
            sendVolumeToSL(volume);
        }

        function updateMeter(volume) {
            // Map the volume to a percentage for the meter
            const volumePercentage = Math.min(volume * 100, 100);
            volumeBar.style.width = `${volumePercentage}%`;
        }

        function sendVolumeToSL(volume) {
            // Send POST request to the SL script with the volume level
            const data = `volume=${volume}`;

            fetch(SL_SERVER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: data,
            })
            .then(response => response.text())
            .then(data => console.log('Success:', data))
            .catch((error) => console.error('Error:', error));
        }

        startBtn.addEventListener('click', startMic);
    </script>
</body>
</html>
